name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=dq_contracts --cov-report=term-missing

  contract-gate:
    # Dogfooding: the example contracts are linted, and the deliberately
    # under-versioned v2 must be rejected by the semver gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: dq-contracts lint examples/contracts/*.yml
      - name: semver gate rejects breaking change without MAJOR bump
        run: |
          if dq-contracts diff examples/contracts/orders.v1.yml examples/contracts/orders.v2.yml; then
            echo "expected the gate to fail" && exit 1
          fi
